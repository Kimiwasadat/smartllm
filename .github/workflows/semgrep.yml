name: Semgrep & npm audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 0 * * 1' # Run weekly on Monday

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    
    # Skip any PR created by dependabot to avoid permission issues
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high/critical only)
        run: npm audit --audit-level=high || true

      - name: Run Semgrep CI
        # Using the official Docker image to run Semgrep CLI directly
        run: docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep ci
        env:
          # Optional: SEMGREP_APP_TOKEN can be added to GitHub Secrets to link to Semgrep App
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
