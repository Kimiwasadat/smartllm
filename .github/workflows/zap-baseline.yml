name: OWASP ZAP Baseline Scan

on:
  # Manual trigger
  workflow_dispatch:

jobs:
  zap_scan:
    name: Run ZAP Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          # Target URL should be set in GitHub Actions variables/secrets.
          # We do not scan localhost as this is a passive baseline against deployed instances.
          target: '${{ vars.ZAP_TARGET_URL || secrets.ZAP_TARGET_URL }}'
          # Generate an HTML and Markdown report
          format: openapi
          cmd_options: '-a'
          
      - name: Upload ZAP Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report_md.md
